# Publishes a downloadable Perch.app (Intel + Apple silicon) as a GitHub Release, built from main.
#
# To release: GitHub → Actions → Release → Run workflow → enter a version such as 0.1.0.
# It tags main as v<version>, builds the app with that version, and attaches Perch-<version>.zip.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number, e.g. 0.1.0 (major.minor.patch)"
        required: true

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: macos-15
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check the version
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.2.3 (got '$VERSION')"
            exit 1
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::v$VERSION already exists. Pick a new version."
            exit 1
          fi

      - name: Stamp the version into the app
        run: |
          plutil -replace CFBundleShortVersionString -string "$VERSION" Resources/Info.plist
          plutil -replace CFBundleVersion -string "$GITHUB_RUN_NUMBER" Resources/Info.plist

      - name: Build (Intel + Apple silicon)
        run: ./scripts/build-app.sh --universal

      - name: Zip
        run: ditto -c -k --keepParent build/Perch.app "Perch-$VERSION.zip"

      - name: Publish the release
        run: |
          cat > notes.md <<'EOF'
          ## Install

          1. Download **Perch-VERSION.zip** below and unzip it.
          2. Drag **Perch.app** into your **Applications** folder.
          3. Open it. The first time, macOS says it can't check the app (Perch isn't notarized by Apple):
             - **macOS 15 or later:** System Settings → Privacy & Security → scroll down → **Open Anyway**
             - **macOS 13–14:** right-click Perch.app → **Open** → **Open**

          Needs macOS 13 or later. Works on Intel and Apple silicon Macs.

          EOF
          sed -i '' "s/VERSION/$VERSION/" notes.md
          gh release create "v$VERSION" "Perch-$VERSION.zip" \
            --target "$(git rev-parse HEAD)" \
            --title "Perch $VERSION" \
            --notes-file notes.md \
            --generate-notes

      # Adds this version as a new row at the top of the README's Versions table (older rows are
      # left as they are) and pushes it to main.
      - name: Add the version to the README
        run: |
          git checkout -- Resources/Info.plist   # the stamped version is only for the build
          git fetch --quiet origin main && git reset --quiet --hard origin/main   # main may have moved during the build
          python3 - <<'EOF'
          import os, datetime
          repo, version = os.environ["GITHUB_REPOSITORY"], os.environ["VERSION"]
          tag, today = f"v{version}", datetime.date.today().isoformat()
          header = "| Version | Released |\n|---|---|\n"
          row = f"| [{tag}](https://github.com/{repo}/releases/tag/{tag}) | {today} |\n"
          readme = open("README.md").read()
          start = "<!-- versions:start -->\n"
          if start not in readme or "<!-- versions:end -->" not in readme:
              raise SystemExit("README has no <!-- versions:start --> / <!-- versions:end --> markers")
          if f"[{tag}]" in readme:
              raise SystemExit(0)   # already listed
          before, after = readme.split(start, 1)
          if after.startswith(header):
              after = header + row + after[len(header):]
          else:   # first release: the table replaces the "No releases yet." line
              after = header + row + after.split("<!-- versions:end -->", 1)[0].replace("No releases yet.\n", "") + "<!-- versions:end -->" + after.split("<!-- versions:end -->", 1)[1]
          open("README.md", "w").write(before + start + after)
          EOF
          if git diff --quiet README.md; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet -m "README: list Perch $VERSION" README.md
          git push --quiet origin HEAD:main
