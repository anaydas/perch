# Publishes a downloadable Perch.app (Intel + Apple silicon) as a GitHub Release, built from main.
#
# To release: GitHub → Actions → Release → Run workflow → enter a version such as 0.1.0.
# It tags main as v<version>, builds the app with that version, attaches Perch-<version>.zip,
# and updates the Homebrew cask in anaydas/homebrew-perch.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number, e.g. 0.1.0 (major.minor.patch)"
        required: true

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: macos-15
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check the version
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.2.3 (got '$VERSION')"
            exit 1
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::v$VERSION already exists. Pick a new version."
            exit 1
          fi

      - name: Stamp the version into the app
        run: |
          plutil -replace CFBundleShortVersionString -string "$VERSION" Resources/Info.plist
          plutil -replace CFBundleVersion -string "$GITHUB_RUN_NUMBER" Resources/Info.plist

      - name: Build (Intel + Apple silicon)
        run: ./scripts/build-app.sh --universal

      - name: Zip
        run: ditto -c -k --keepParent build/Perch.app "Perch-$VERSION.zip"

      - name: Publish the release
        run: |
          cat > notes.md <<'EOF'
          ## Install

          **With Homebrew:** `brew install --cask anaydas/perch/perch` (or `brew upgrade --cask perch` to update)

          **Or download it:**

          1. Download **Perch-VERSION.zip** below and unzip it.
          2. Drag **Perch.app** into your **Applications** folder.
          3. Open it. The first time, macOS says it can't check the app (Perch isn't notarized by Apple):
             - **macOS 15 or later:** System Settings → Privacy & Security → scroll down → **Open Anyway**
             - **macOS 13–14:** right-click Perch.app → **Open** → **Open**

          Needs macOS 13 or later. Works on Intel and Apple silicon Macs.

          EOF
          sed -i '' "s/VERSION/$VERSION/" notes.md
          gh release create "v$VERSION" "Perch-$VERSION.zip" \
            --target "$(git rev-parse HEAD)" \
            --title "Perch $VERSION" \
            --notes-file notes.md \
            --generate-notes

      # Points the Homebrew cask (github.com/anaydas/homebrew-perch) at this release, so
      # `brew upgrade --cask perch` picks it up. Needs the HOMEBREW_PERCH_TAP_TOKEN secret: a fine-grained
      # token with Contents read and write on homebrew-perch only. Without it, this step is skipped.
      - name: Update the Homebrew cask
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_PERCH_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::notice::HOMEBREW_PERCH_TAP_TOKEN isn't set, so the Homebrew cask wasn't updated."
            exit 0
          fi
          SHA=$(shasum -a 256 "Perch-$VERSION.zip" | cut -d ' ' -f 1)
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/anaydas/homebrew-perch.git" tap
          cd tap
          sed -i '' -E "s/^  version \".*\"/  version \"$VERSION\"/; s/^  sha256 \".*\"/  sha256 \"$SHA\"/" Casks/perch.rb
          if git diff --quiet; then
            echo "The cask is already at $VERSION."
            exit 0
          fi
          git diff
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "perch $VERSION"
          git push
          echo "::notice::Homebrew cask updated to $VERSION."
